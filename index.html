<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <meta name="description" content="Public GitHub Pages hub.">\
  <!-- Parsed automatically from URL, or set manually here -->
  <meta name="github-username" content="">
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-2: #f8fafc;
      --text: #14202b;
      --muted: #5a6776;
      --line: #d9e1e8;
      --accent: #1f5fa9;
      --accent-soft: #eaf2fb;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.06);
      --radius: 18px;
      --max: 72rem;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: linear-gradient(to bottom, #fbfcfe 0%, var(--bg) 100%);
      color: var(--text);
      font: 400 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(31, 95, 169, 0.28);
      outline-offset: 3px;
      border-radius: 12px;
    }

    .container {
      width: min(calc(100% - 2rem), var(--max));
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1rem;
      background: var(--text);
      color: #fff;
      border-radius: 0 0 12px 12px;
    }

    .skip-link:focus { left: 1rem; }

    .site-header { padding: 1rem 0 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0 0;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .nav a {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav a:hover { color: var(--text); }

    .hero { padding: 4rem 0 2.5rem; }

    .hero-shell {
      display: grid;
      gap: 1.25rem;
      padding: 1.35rem;
      background: var(--surface);
      border: 1px solid rgba(217, 225, 232, 0.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--surface-2);
      flex: 0 0 auto;
    }

    .hero-copy {
      min-width: 0;
      display: grid;
      gap: 0.55rem;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 4.8rem);
      line-height: 0.96;
      letter-spacing: -0.045em;
      max-width: 12ch;
    }

    .hero .tagline {
      margin: 0;
      color: var(--text);
      font-size: clamp(1rem, 2vw, 1.24rem);
      font-weight: 600;
    }

    .meta-row,
    .social-row,
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .pill,
    .pill-link,
    .social-link,
    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2rem;
      padding: 0.38rem 0.72rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }

    .pill-link,
    .social-link {
      color: var(--text);
      background: rgba(255, 255, 255, 0.72);
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .pill-link:hover,
    .social-link:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .pill-icon,
    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.2rem;
      height: 1.2rem;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .pill-icon svg,
    .social-icon svg {
      width: 0.85rem;
      height: 0.85rem;
    }

    .section { padding: 2.2rem 0; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }

    .section-header h2 {
      margin: 0;
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      letter-spacing: -0.03em;
    }

    .count-badge {
      color: var(--text);
      font-weight: 700;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 2.6rem;
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .icon-button:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .icon-button svg {
      width: 1rem;
      height: 1rem;
      flex: 0 0 auto;
    }

    .icon-button-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.55rem;
      height: 1.55rem;
      padding: 0 0.4rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .card {
      position: relative;
      display: grid;
      gap: 0.85rem;
      padding: 1.1rem;
      background: var(--surface);
      border: 1px solid rgba(217, 225, 232, 0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .card:hover { transform: translateY(-1px); }

    .card h3 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .title-line {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }

    .fork-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      height: 1rem;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .fork-icon svg {
      width: 1rem;
      height: 1rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .card-cover-link {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
    }

    .card-top,
    .card-body,
    .meta {
      position: relative;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 1.8rem;
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .subtle-link {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      transition: background-color 160ms ease, color 160ms ease;
    }

    .subtle-link:hover {
      background: #fff;
      color: var(--text);
    }

    .subtle-link svg {
      width: 1rem;
      height: 1rem;
    }

    .notice {
      padding: 0.95rem 1rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .site-footer {
      padding: 2.4rem 0 3rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .site-footer p { margin: 0; }
    [hidden] { display: none !important; }

    @media (min-width: 700px) {
      .hero { padding: 5.2rem 0 3rem; }
      .hero-shell { padding: 1.7rem; }
      .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 980px) {
      .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div class="topbar">
        <a class="brand" href="#top" id="brand">GitHub</a>
        <nav class="nav" aria-label="Primary">
          <a id="nav-pages" href="#pages" hidden>Pages</a>
          <a id="nav-repositories" href="#repositories" hidden>Repositories</a>
          <a id="nav-gists" href="#gists" hidden>Gists</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="container">
        <div class="hero-shell">
          <div class="hero-top">
            <img id="hero-avatar" class="avatar" src="" alt="" hidden>
            <div class="hero-copy">
              <h1 id="hero-name">GitHub</h1>
              <p id="hero-tagline" class="tagline" hidden></p>
            </div>
          </div>
          <div id="hero-meta" class="meta-row" hidden></div>
          <div id="hero-socials" class="social-row" hidden></div>
        </div>
      </div>
    </section>

    <section class="section" id="pages" hidden>
      <div class="container">
        <div class="section-header">
          <div class="section-heading">
            <h2>Pages</h2>
            <span id="pages-count" class="count-badge"></span>
          </div>
        </div>
        <div id="pages-grid" class="cards-grid"></div>
      </div>
    </section>

    <section class="section" id="repositories" hidden>
      <div class="container">
        <div class="section-header">
          <div class="section-heading">
            <h2>Repositories</h2>
            <span id="repositories-count" class="count-badge"></span>
          </div>
          <button id="repositories-toggle" class="icon-button" type="button" hidden aria-expanded="false"></button>
        </div>
        <div id="repositories-grid" class="cards-grid"></div>
      </div>
    </section>

    <section class="section" id="gists" hidden>
      <div class="container">
        <div class="section-header">
          <div class="section-heading">
            <h2>Gists</h2>
            <span id="gists-count" class="count-badge"></span>
          </div>
          <button id="gists-toggle" class="icon-button" type="button" hidden aria-expanded="false"></button>
        </div>
        <div id="gists-grid" class="cards-grid"></div>
      </div>
    </section>

    <section class="section" id="notice-section" hidden>
      <div class="container">
        <div id="notice" class="notice"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footer-name"></span></p>
    </div>
  </footer>

  <script>
    const state = {
      username: "",
      profile: null,
      repositoriesExpanded: false,
      gistsExpanded: false,
      repositories: [],
      gists: [],
      pages: [],
      socials: []
    };

    const CACHE_TTL_MS = 1000 * 60 * 60;
    const INITIAL_REPOSITORY_COUNT = 6;
    const INITIAL_GIST_COUNT = 4;

    const brandEl = document.querySelector("#brand");
    const yearEl = document.querySelector("#year");
    const footerNameEl = document.querySelector("#footer-name");
    const noticeSectionEl = document.querySelector("#notice-section");
    const noticeEl = document.querySelector("#notice");
    const heroAvatarEl = document.querySelector("#hero-avatar");
    const heroNameEl = document.querySelector("#hero-name");
    const heroTaglineEl = document.querySelector("#hero-tagline");
    const heroMetaEl = document.querySelector("#hero-meta");
    const heroSocialsEl = document.querySelector("#hero-socials");
    const pagesSectionEl = document.querySelector("#pages");
    const pagesCountEl = document.querySelector("#pages-count");
    const pagesGridEl = document.querySelector("#pages-grid");
    const repositoriesSectionEl = document.querySelector("#repositories");
    const repositoriesCountEl = document.querySelector("#repositories-count");
    const repositoriesGridEl = document.querySelector("#repositories-grid");
    const repositoriesToggleEl = document.querySelector("#repositories-toggle");
    const gistsSectionEl = document.querySelector("#gists");
    const gistsCountEl = document.querySelector("#gists-count");
    const gistsGridEl = document.querySelector("#gists-grid");
    const gistsToggleEl = document.querySelector("#gists-toggle");
    const navPagesEl = document.querySelector("#nav-pages");
    const navRepositoriesEl = document.querySelector("#nav-repositories");
    const navGistsEl = document.querySelector("#nav-gists");

    yearEl.textContent = String(new Date().getFullYear());

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function hasDisplayValue(value) {
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function yearFromDate(value) {
      if (!value) return "";
      return String(new Date(value).getFullYear());
    }

    function normalizeUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (raw.startsWith("http://") || raw.startsWith("https://")) return raw;
      if (raw.includes(".") && !raw.includes(" ")) return "https://" + raw;
      return "";
    }

    function getConfiguredUsername() {
      const meta = document.querySelector('meta[name="github-username"]');
      return meta ? String(meta.content || "").trim() : "";
    }

    function deriveUsernameFromHost(host) {
      const normalized = String(host || "").toLowerCase();
      const suffix = ".github.io";
      return normalized.endsWith(suffix)
        ? normalized.slice(0, normalized.length - suffix.length)
        : "";
    }

    function deriveUsername() {
      return getConfiguredUsername() || deriveUsernameFromHost(window.location.hostname);
    }

    function cacheKey(suffix) {
      return "gh-profile-skin:v7:" + state.username + ":" + suffix;
    }

    function readCache(suffix, allowStale = false) {
      try {
        const raw = localStorage.getItem(cacheKey(suffix));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed.savedAt !== "number") return null;
        const isFresh = Date.now() - parsed.savedAt < CACHE_TTL_MS;
        if (!allowStale && !isFresh) return null;
        return parsed.data;
      } catch {
        return null;
      }
    }

    function writeCache(suffix, data) {
      try {
        localStorage.setItem(cacheKey(suffix), JSON.stringify({ savedAt: Date.now(), data: data }));
      } catch {
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
      if (!response.ok) {
        const error = new Error("GitHub API request failed with status " + response.status);
        error.status = response.status;
        throw error;
      }
      return response.json();
    }

    async function fetchAllRepos(username) {
      const repos = [];
      let page = 1;
      while (page <= 10) {
        const url = "https://api.github.com/users/" + encodeURIComponent(username) + "/repos?per_page=100&page=" + page + "&sort=updated";
        const batch = await fetchJson(url);
        repos.push(...batch);
        if (batch.length < 100) break;
        page += 1;
      }
      return repos;
    }

    async function fetchAllGists(username) {
      const gists = [];
      let page = 1;
      while (page <= 10) {
        const url = "https://api.github.com/users/" + encodeURIComponent(username) + "/gists?per_page=100&page=" + page;
        const batch = await fetchJson(url);
        gists.push(...batch);
        if (batch.length < 100) break;
        page += 1;
      }
      return gists;
    }

    async function loadRawRepos() {
      const cached = readCache("repos-raw");
      if (cached) return cached;
      const repos = await fetchAllRepos(state.username);
      writeCache("repos-raw", repos);
      return repos;
    }

    function buildPagesUrl(username, repo) {
      const homepage = normalizeUrl(repo.homepage);
      if (homepage) return homepage;
      if (repo.name.toLowerCase() === username.toLowerCase() + ".github.io") {
        return "https://" + username + ".github.io/";
      }
      return "https://" + username + ".github.io/" + repo.name + "/";
    }

    function githubIconSvg() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.69c-2.78.6-3.37-1.18-3.37-1.18-.46-1.15-1.11-1.45-1.11-1.45-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.84.09-.64.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.95 0-1.09.39-1.98 1.03-2.67-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.5 9.5 0 0 1 12 6.84c.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.69 1.03 1.58 1.03 2.67 0 3.85-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" /></svg>';
    }

    function forkIconSvg() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15 4a3 3 0 1 0 2 5.24V11a3 3 0 0 1-3 3h-3V9.24a3 3 0 1 0-2 0V18a3 3 0 1 0 2 0v-2h3a5 5 0 0 0 5-5V9.24A3 3 0 0 0 15 4Zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2ZM8 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm0 12a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z" /></svg>';
    }

    function externalIconSvg() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3ZM5 5h6v2H7v10h10v-4h2v6H5V5Z" /></svg>';
    }

    function detectProvider(url) {
      let hostname = "";
      try {
        hostname = new URL(url).hostname.toLowerCase();
      } catch {
        return { key: "website", label: "Web", icon: "·", href: url };
      }

      if (hostname.startsWith("www.")) hostname = hostname.slice(4);

      const catalog = [
        { parts: ["github.com"], key: "github", label: "GitHub", icon: "GH" },
        { parts: ["linkedin.com"], key: "linkedin", label: "LinkedIn", icon: "in" },
        { parts: ["x.com", "twitter.com"], key: "x", label: "X", icon: "X" },
        { parts: ["facebook.com"], key: "facebook", label: "Facebook", icon: "f" },
        { parts: ["instagram.com"], key: "instagram", label: "Instagram", icon: "ig" },
        { parts: ["youtube.com", "youtu.be"], key: "youtube", label: "YouTube", icon: "▶" },
        { parts: ["mastodon", ".social"], key: "mastodon", label: "Mastodon", icon: "m" }
      ];

      for (const item of catalog) {
        if (item.parts.some((part) => hostname.includes(part))) {
          return { key: item.key, label: item.label, icon: item.icon, href: url };
        }
      }

      return { key: "website:" + hostname, label: hostname, icon: "·", href: url };
    }

    function extractSocials(profile) {
      const map = new Map();

      function add(url) {
        const normalized = normalizeUrl(url);
        if (!normalized) return;
        const social = detectProvider(normalized);
        if (social.key === "github") return;
        const dedupe = social.key + ":" + normalized.toLowerCase();
        if (!map.has(dedupe)) map.set(dedupe, social);
      }

      if (hasDisplayValue(profile.twitter_username)) add("https://x.com/" + profile.twitter_username);

      if (hasDisplayValue(profile.blog)) {
        const tokens = String(profile.blog).replaceAll(",", " ").split(" ").map((item) => item.trim()).filter(Boolean);
        tokens.forEach(add);
      }

      if (hasDisplayValue(profile.bio)) {
        const tokens = String(profile.bio).replaceAll(",", " ").split(" ").map((item) => item.trim()).filter(Boolean);
        tokens.filter((item) => item.startsWith("http://") || item.startsWith("https://") || item.startsWith("www.")).forEach(add);
      }

      const preferredOrder = ["linkedin", "x", "facebook", "instagram", "youtube", "mastodon"];
      return Array.from(map.values()).sort((a, b) => {
        const ai = preferredOrder.indexOf(a.key);
        const bi = preferredOrder.indexOf(b.key);
        if (ai === -1 && bi === -1) return a.label.localeCompare(b.label);
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });
    }

    function setSectionVisibility(sectionEl, navEl, visible) {
      sectionEl.hidden = !visible;
      if (navEl) navEl.hidden = !visible;
    }

    function setToggleButton(buttonEl, expanded, hiddenCount, label) {
      const countMarkup = !expanded && hiddenCount > 0
        ? '<span class="icon-button-count" aria-hidden="true">' + hiddenCount + '</span>'
        : '';
      const iconMarkup = expanded
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 18l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>';
      buttonEl.setAttribute("aria-expanded", String(expanded));
      buttonEl.setAttribute("aria-label", expanded ? "Collapse " + label : "Show " + hiddenCount + " more " + label);
      buttonEl.setAttribute("title", expanded ? "Collapse " + label : String(hiddenCount) + " more");
      buttonEl.innerHTML = countMarkup + iconMarkup;
    }

    function renderHero(profile) {
      const displayName = profile.name || state.username;
      const githubUrl = hasDisplayValue(profile.html_url) ? profile.html_url : "https://github.com/" + state.username;
      const metaItems = [];

      brandEl.textContent = displayName;
      footerNameEl.textContent = displayName;
      heroNameEl.textContent = displayName;
      document.title = displayName + " · GitHub";

      if (hasDisplayValue(profile.avatar_url)) {
        heroAvatarEl.src = profile.avatar_url;
        heroAvatarEl.alt = displayName + " avatar";
        heroAvatarEl.hidden = false;
      } else {
        heroAvatarEl.hidden = true;
      }

      if (hasDisplayValue(profile.bio)) {
        heroTaglineEl.textContent = profile.bio;
        heroTaglineEl.hidden = false;
      } else {
        heroTaglineEl.hidden = true;
      }

      if (hasDisplayValue(profile.login)) {
        metaItems.push('<a class="pill-link" href="' + escapeHtml(githubUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile"><span class="pill-icon" aria-hidden="true">' + githubIconSvg() + '</span><span>@' + escapeHtml(profile.login) + '</span></a>');
      }
      if (hasDisplayValue(profile.location)) metaItems.push('<span class="pill">' + escapeHtml(profile.location) + '</span>');
      if (hasDisplayValue(profile.company)) metaItems.push('<span class="pill">' + escapeHtml(profile.company) + '</span>');
      if (hasDisplayValue(profile.created_at)) metaItems.push('<span class="pill">' + escapeHtml(yearFromDate(profile.created_at)) + '</span>');

      if (metaItems.length) {
        heroMetaEl.hidden = false;
        heroMetaEl.innerHTML = metaItems.join('');
      } else {
        heroMetaEl.hidden = true;
        heroMetaEl.innerHTML = '';
      }

      state.socials = extractSocials(profile);
      if (state.socials.length) {
        heroSocialsEl.hidden = false;
        heroSocialsEl.innerHTML = state.socials.map((social) => '<a class="social-link" href="' + escapeHtml(social.href) + '" target="_blank" rel="noopener noreferrer"><span class="social-icon" aria-hidden="true">' + escapeHtml(social.icon) + '</span><span>' + escapeHtml(social.label) + '</span></a>').join('');
      } else {
        heroSocialsEl.hidden = true;
        heroSocialsEl.innerHTML = '';
      }
    }

    function renderPages() {
      const items = state.pages;
      setSectionVisibility(pagesSectionEl, navPagesEl, items.length > 0);
      if (!items.length) {
        pagesGridEl.innerHTML = '';
        return;
      }

      pagesCountEl.textContent = String(items.length);
      pagesGridEl.innerHTML = items.map((item) => {
        const chips = [];
        if (item.language) chips.push('<span class="chip">' + escapeHtml(item.language) + '</span>');
        if (item.updatedAt) chips.push('<span class="chip">' + escapeHtml(formatDate(item.updatedAt)) + '</span>');
        const description = item.description ? '<div class="card-body"><p>' + escapeHtml(item.description) + '</p></div>' : '';
        const meta = chips.length ? '<div class="meta">' + chips.join('') + '</div>' : '';
        return '<article class="card"><a class="card-cover-link" href="' + escapeHtml(item.siteUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(item.name) + '"></a><div class="card-top"><h3>' + escapeHtml(item.name) + '</h3><a class="subtle-link" href="' + escapeHtml(item.repoUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="Repository">' + githubIconSvg() + '</a></div>' + description + meta + '</article>';
      }).join('');
    }

    function renderRepositories() {
      const items = state.repositories;
      const count = items.length;
      setSectionVisibility(repositoriesSectionEl, navRepositoriesEl, count > 0);
      if (!count) {
        repositoriesGridEl.innerHTML = '';
        return;
      }

      repositoriesCountEl.textContent = String(count);
      const visible = state.repositoriesExpanded ? items : items.slice(0, INITIAL_REPOSITORY_COUNT);
      repositoriesGridEl.innerHTML = visible.map((item) => {
        const chips = [];
        if (item.language) chips.push('<span class="chip">' + escapeHtml(item.language) + '</span>');
        if (item.updatedAt) chips.push('<span class="chip">' + escapeHtml(formatDate(item.updatedAt)) + '</span>');
        if (item.stars > 0) chips.push('<span class="chip">★ ' + escapeHtml(item.stars) + '</span>');
        const forkBadge = item.isFork ? '<span class="fork-icon" title="Forked repository" aria-label="Forked repository">' + forkIconSvg() + '</span>' : '';
        const homepage = item.homepage ? '<a class="subtle-link" href="' + escapeHtml(item.homepage) + '" target="_blank" rel="noopener noreferrer" aria-label="Homepage">' + externalIconSvg() + '</a>' : '';
        const description = item.description ? '<div class="card-body"><p>' + escapeHtml(item.description) + '</p></div>' : '';
        const meta = chips.length ? '<div class="meta">' + chips.join('') + '</div>' : '';
        return '<article class="card"><a class="card-cover-link" href="' + escapeHtml(item.repoUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(item.name) + '"></a><div class="card-top"><h3 class="title-line">' + escapeHtml(item.name) + forkBadge + '</h3>' + homepage + '</div>' + description + meta + '</article>';
      }).join('');

      const showToggle = count > INITIAL_REPOSITORY_COUNT;
      const hiddenCount = Math.max(0, count - INITIAL_REPOSITORY_COUNT);
      repositoriesToggleEl.hidden = !showToggle;
      if (showToggle) setToggleButton(repositoriesToggleEl, state.repositoriesExpanded, hiddenCount, 'repositories');
    }

    function renderGists() {
      const items = state.gists;
      const count = items.length;
      setSectionVisibility(gistsSectionEl, navGistsEl, count > 0);
      if (!count) {
        gistsGridEl.innerHTML = '';
        return;
      }

      gistsCountEl.textContent = String(count);
      const visible = state.gistsExpanded ? items : items.slice(0, INITIAL_GIST_COUNT);
      gistsGridEl.innerHTML = visible.map((item) => {
        const chips = [];
        if (item.updatedAt) chips.push('<span class="chip">' + escapeHtml(formatDate(item.updatedAt)) + '</span>');
        if (item.fileCount > 0) chips.push('<span class="chip">' + escapeHtml(item.fileCount) + '</span>');
        const description = item.description ? '<div class="card-body"><p>' + escapeHtml(item.description) + '</p></div>' : '';
        const meta = chips.length ? '<div class="meta">' + chips.join('') + '</div>' : '';
        return '<article class="card"><a class="card-cover-link" href="' + escapeHtml(item.gistUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(item.title) + '"></a><div class="card-top"><h3>' + escapeHtml(item.title) + '</h3></div>' + description + meta + '</article>';
      }).join('');

      const showToggle = count > INITIAL_GIST_COUNT;
      const hiddenCount = Math.max(0, count - INITIAL_GIST_COUNT);
      gistsToggleEl.hidden = !showToggle;
      if (showToggle) setToggleButton(gistsToggleEl, state.gistsExpanded, hiddenCount, 'gists');
    }

    async function loadProfile() {
      const cached = readCache('profile');
      if (cached) {
        state.profile = cached;
        renderHero(cached);
        return;
      }
      const profile = await fetchJson('https://api.github.com/users/' + encodeURIComponent(state.username));
      state.profile = profile;
      writeCache('profile', profile);
      renderHero(profile);
    }

    async function loadPages() {
      const cached = readCache('pages');
      if (cached) {
        state.pages = cached;
        renderPages();
        return;
      }
      const repos = await loadRawRepos();
      const excludedRepo = state.username.toLowerCase() + '.github.io';
      state.pages = repos
        .filter((repo) => repo.has_pages && repo.name.toLowerCase() !== excludedRepo)
        .map((repo) => ({
          name: repo.name,
          description: repo.description || '',
          siteUrl: buildPagesUrl(state.username, repo),
          repoUrl: repo.html_url,
          updatedAt: repo.pushed_at || repo.updated_at,
          language: repo.language || ''
        }))
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      writeCache('pages', state.pages);
      renderPages();
    }

    async function loadRepositories() {
      const cached = readCache('repositories');
      if (cached) {
        state.repositories = cached;
        renderRepositories();
        return;
      }
      const repos = await loadRawRepos();
      state.repositories = repos
        .map((repo) => ({
          name: repo.name,
          description: repo.description || '',
          repoUrl: repo.html_url,
          homepage: normalizeUrl(repo.homepage),
          updatedAt: repo.pushed_at || repo.updated_at,
          language: repo.language || '',
          stars: repo.stargazers_count || 0,
          isFork: Boolean(repo.fork)
        }))
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      writeCache('repositories', state.repositories);
      renderRepositories();
    }

    async function loadGists() {
      const cached = readCache('gists');
      if (cached) {
        state.gists = cached;
        renderGists();
        return;
      }
      const gists = await fetchAllGists(state.username);
      state.gists = gists
        .map((gist) => {
          const files = Object.values(gist.files || {});
          const firstFile = files[0] || {};
          return {
            title: firstFile.filename || gist.description || gist.id,
            description: gist.description || '',
            gistUrl: gist.html_url,
            updatedAt: gist.updated_at,
            fileCount: files.length
          };
        })
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      writeCache('gists', state.gists);
      renderGists();
    }

    function showNotice(message) {
      noticeEl.textContent = message;
      noticeSectionEl.hidden = !hasDisplayValue(message);
    }

    function runSelfTests() {
      console.assert(deriveUsernameFromHost('lukasshannon.github.io') === 'lukasshannon', 'host parsing failed');
      console.assert(deriveUsernameFromHost('example.com') === '', 'host parsing false positive');
      console.assert(normalizeUrl('linkedin.com/in/test') === 'https://linkedin.com/in/test', 'normalizeUrl failed');
      console.assert(buildPagesUrl('lukasshannon', { name: 'demo', homepage: '' }) === 'https://lukasshannon.github.io/demo/', 'buildPagesUrl failed');
      console.assert(detectProvider('https://www.linkedin.com/in/test').label === 'LinkedIn', 'detectProvider failed');
      console.assert(typeof githubIconSvg() === 'string' && githubIconSvg().includes('<svg'), 'github icon svg failed');
      console.assert(typeof forkIconSvg() === 'string' && forkIconSvg().includes('<svg'), 'fork icon svg failed');
      console.assert(typeof externalIconSvg() === 'string' && externalIconSvg().includes('<svg'), 'external icon svg failed');
    }

    repositoriesToggleEl.addEventListener('click', () => {
      state.repositoriesExpanded = !state.repositoriesExpanded;
      renderRepositories();
    });

    gistsToggleEl.addEventListener('click', () => {
      state.gistsExpanded = !state.gistsExpanded;
      renderGists();
    });

    async function init() {
      runSelfTests();
      state.username = deriveUsername();

      if (!state.username) {
        heroNameEl.textContent = 'GitHub';
        showNotice('GitHub username not found.');
        return;
      }

      try {
        await loadProfile();
      } catch (error) {
        const stale = readCache('profile', true);
        if (stale) {
          state.profile = stale;
          renderHero(stale);
          showNotice('Cached profile');
        } else {
          console.error(error);
          showNotice('GitHub unavailable');
        }
      }

      try {
        await loadPages();
      } catch (error) {
        const stale = readCache('pages', true);
        if (stale) {
          state.pages = stale;
          renderPages();
          showNotice('Cached pages');
        } else {
          console.error(error);
        }
      }

      try {
        await loadRepositories();
      } catch (error) {
        const stale = readCache('repositories', true);
        if (stale) {
          state.repositories = stale;
          renderRepositories();
        } else {
          console.error(error);
        }
      }

      try {
        await loadGists();
      } catch (error) {
        const stale = readCache('gists', true);
        if (stale) {
          state.gists = stale;
          renderGists();
        } else {
          console.error(error);
        }
      }
    }

    init();
  </script>
</body>
</html>
